name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "57.129.141.64 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEBSuX8kS09Q4YR1JXPEk/4suvr6bueiFnTXoOAO+/7l" > ~/.ssh/known_hosts

      # The authorized_keys entry for this key forces the deploy script on the
      # server, so the remote command below is informational only.
      - name: Deploy to VPS
        run: ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes adam@57.129.141.64 deploy

      - name: Verify production
        run: curl -fsSL -o /dev/null -w 'adamszczotka.dev -> %{http_code}\n' --retry 3 --retry-delay 5 https://adamszczotka.dev/
